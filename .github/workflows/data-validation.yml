name: Validate public data
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.20.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run data:check
      - run: npm test
